<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="shortcut icon" href="assets/media/Calculator - Navy Blue Icon.jfif" type="image/x-icon">
    <title>Calculater</title>
</head>
<body>
      <section class="min-h-screen bg-gray-800 flex items-center justify-center px-4">
    
    <div class="bg-gray-900 rounded-2xl shadow-2xl w-full max-w-sm p-5">
        
        <input  
            type="text" 
            id="display"
            class="w-full text-white text-right text-2xl sm:text-3xl rounded-lg p-3 mb-4 bg-gray-700"
        >

        <div class="grid grid-cols-4 gap-3 sm:gap-4">
            
            <button class="btn bg-red-500 text-white">AC</button>
            <button class="btn bg-yellow-500 text-white">DEL</button>
            <button class="btn bg-blue-500 text-white">%</button>
            <button class="btn bg-blue-500 text-white">÷</button>

            <button class="btn text-white">9</button>
            <button class="btn text-white">8</button>
            <button class="btn text-white">7</button>
            <button class="btn bg-blue-500 text-white">+</button>

            <button class="btn text-white">6</button>
            <button class="btn text-white">5</button>
            <button class="btn text-white">4</button>
            <button class="btn bg-blue-500 text-white">x</button>

            <button class="btn text-white">3</button>
            <button class="btn text-white">2</button>
            <button class="btn text-white">1</button>
            <button class="btn bg-blue-500 text-white">-</button>
            
            <button class="btn col-span-2 text-white">0</button>
            <button class="btn text-white">.</button>
            <button class="btn bg-green-500 text-white">=</button>

        </div>
        <br>
     <h6 id="dev">Develped by -Ahmad</h6>
    </div>
    

</section>

      <script src="./assets/js/sw.js"></script>
      <script src="./manifest.json"></script>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <script src="./assets/js/script.js"></script>
</body>
</html>
